name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    name: no committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: repo secret check
        run: ./scripts/check-no-secrets.sh
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  kustomize:
    name: manifests build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install kustomize
        run: |
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          kustomize version
      - name: build base
        run: kustomize build deploy/kubernetes/base > /tmp/base.yaml && grep -c '^kind:' /tmp/base.yaml
      - name: build runtime overlays
        run: |
          kustomize build deploy/kubernetes/overlays/gvisor > /tmp/gvisor.yaml
          kustomize build deploy/kubernetes/overlays/kata > /tmp/kata.yaml
          kustomize build deploy/kubernetes/overlays/sandboxed > /tmp/sandboxed.yaml
      - name: build example overlay
        run: kustomize build deploy/kubernetes/overlays/example > /tmp/example.yaml
      - name: assert runtime overlays stay isolated
        run: |
          for manifest in /tmp/gvisor.yaml /tmp/kata.yaml; do
            count=$(grep -c 'runtimeClassName' "$manifest")
            echo "$manifest runtimeClassName occurrences: $count"
            [ "$count" -eq 3 ] || { echo "expected 3 sandboxed workloads"; exit 1; }
          done
          [ "$(grep -c 'runtimeClassName: gvisor' /tmp/gvisor.yaml)" -eq 3 ]
          [ "$(grep -c 'runtimeClassName: kata' /tmp/kata.yaml)" -eq 3 ]
          cmp /tmp/gvisor.yaml /tmp/sandboxed.yaml
          if grep -Eq 'NODE_OPTIONS|NODE_PATH|firecrawl-systeminformation-compat' /tmp/kata.yaml; then
            echo "gVisor compatibility logic leaked into Kata overlay"; exit 1
          fi
      - name: assert Firecrawl gVisor compatibility contract
        run: |
          grep -q 'NODE_OPTIONS' /tmp/gvisor.yaml
          grep -q -- '--require=/opt/firecrawl-compat/firecrawl-systeminformation-compat.cjs' /tmp/gvisor.yaml
          grep -q 'NODE_PATH' /tmp/gvisor.yaml
          grep -q 'value: /app/node_modules' /tmp/gvisor.yaml
          grep -q 'name: firecrawl-systeminformation-compat-' /tmp/gvisor.yaml
      - name: test Firecrawl sandbox CPU compatibility shim
        run: node scripts/test-firecrawl-systeminformation-compat.cjs
      - name: assert every image is digest-pinned
        run: |
          # Any `image:` without an @sha256: pin is a floating tag.
          if grep -E '^\s+image:' /tmp/example.yaml | grep -v '@sha256:'; then
            echo "unpinned image found"; exit 1
          fi
          echo "all images digest-pinned"
      - name: assert search routing is explicit
        run: |
          grep -q 'search_backend: searxng' /tmp/base.yaml || {
            echo "web.search_backend must be pinned to searxng"; exit 1; }
          echo "search backend pinned"
      - name: assert SearXNG has independent fallback engines
        run: >-
          python3 scripts/check-searxng-fallback-engines.py
          deploy/kubernetes/base/searxng/files/settings.yml
          deploy/compose/searxng/settings.yml
      - name: test SearXNG fallback-engine checks
        run: python3 scripts/test-searxng-fallback-engines.py
      - name: assert Firecrawl capacity is bounded
        run: >-
          python3 scripts/check-firecrawl-capacity.py /tmp/base.yaml
          --compose-manifest deploy/compose/docker-compose.yml
      - name: test Firecrawl capacity checks
        run: python3 scripts/test-firecrawl-capacity.py
      - name: assert Firecrawl extraction model gateway wiring
        run: |
          for manifest in /tmp/base.yaml /tmp/gvisor.yaml /tmp/kata.yaml /tmp/example.yaml; do
            python3 scripts/check-firecrawl-extraction-env.py "$manifest" \
              --compose-manifest deploy/compose/docker-compose.yml
          done
      - name: assert PostgreSQL readiness budget
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("deploy/kubernetes/base/firecrawl/deployment.yaml").read_text()
          deployment = manifest.split("name: firecrawl-nuq-postgres", 1)[1]
          probe = re.search(r"readinessProbe:(.*?)resources:", deployment, re.S)
          assert probe, "PostgreSQL readinessProbe missing"
          timeout = re.search(r"timeoutSeconds:\s*(\d+)", probe.group(1))
          failures = re.search(r"failureThreshold:\s*(\d+)", probe.group(1))
          assert timeout and int(timeout.group(1)) >= 10, "readiness timeout must be at least 10s"
          assert failures and int(failures.group(1)) >= 3, "readiness failure budget missing"
          PY
      - name: test Firecrawl extraction model gateway checks
        run: python3 scripts/test-firecrawl-extraction-env.py
      - name: assert model credentials reach the profile scope
        run: >-
          python3 scripts/check-hermes-profile-env.py /tmp/base.yaml
          deploy/kubernetes/base/hermes-agent/files/config.yaml.partial
      - name: test model credential manifest checks
        run: python3 scripts/test-hermes-profile-env-check.py
      - name: test profile credential synchronization
        run: python3 scripts/test-profile-env.py
      - name: test persistent config migration
        run: python3 scripts/test-bootstrap-config.py
      - name: assert Hermes wrapper stays non-interactive
        run: |
          grep -A2 '^      - args:$' /tmp/base.yaml | grep -q -- '- sleep' || {
            echo "Hermes container must run the blocking sleep command"; exit 1; }
          grep -A2 '^      - args:$' /tmp/base.yaml | grep -q -- '- infinity' || {
            echo "Hermes container must not fall back to the interactive CLI"; exit 1; }
          echo "Hermes wrapper command pinned"

  validate:
    name: kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install tools
        run: |
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/
          curl -sSLo /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/
      - name: validate schemas
        run: |
          kustomize build deploy/kubernetes/overlays/example \
            | kubeconform -strict -summary -ignore-missing-schemas

  compose:
    name: compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate compose
        working-directory: deploy/compose
        run: |
          cp .env.example .env
          ./init.sh >/dev/null
          sed -i 's|^HERMES_MODEL_DEFAULT=.*|HERMES_MODEL_DEFAULT=ci/model|' .env
          sed -i 's|^FIRECRAWL_MODEL_DEFAULT=.*|FIRECRAWL_MODEL_DEFAULT=ci/structured-model|' .env
          sed -i 's|^HERMES_MODEL_BASE_URL=.*|HERMES_MODEL_BASE_URL=https://ci.example/v1|' .env
          sed -i 's|^HERMES_GATEWAY_API_KEY=.*|HERMES_GATEWAY_API_KEY=ci-model-key|' .env
          docker compose config > /tmp/compose.yaml
          echo "compose config OK"
      - name: assert UIs are not bound to 0.0.0.0 by default
        working-directory: deploy/compose
        run: |
          if grep -E 'host_ip: 0\.0\.0\.0' /tmp/compose.yaml; then
            echo "a service is exposed on all interfaces by default"; exit 1
          fi
          echo "host bindings are loopback-only"

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck scripts/*.sh deploy/compose/init.sh
