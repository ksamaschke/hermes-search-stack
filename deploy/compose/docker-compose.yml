# Hermes Search Stack — Docker Compose (VM / bare-metal fallback)
#
# For environments without Kubernetes. Same four components, same wiring:
#   SearXNG (search)  ->  Hermes Agent  <-  Open WebUI (chat)
#   Firecrawl (scrape) ->  Hermes Agent + Open WebUI
#   Hermes WebUI (admin) shares the agent's HERMES_HOME
#
# Quick start:
#   cp .env.example .env && ./init.sh    # generates secrets into .env
#   docker compose up -d
#
# Only the two UIs bind to the host. SearXNG, Firecrawl, and the agent's API
# stay on the internal bridge network.

name: hermes-search-stack

services:
  # ---------------------------------------------------------------- search --
  searxng:
    image: docker.io/searxng/searxng:2026.8.29-d226b78bc@sha256:b36af7984b87191b595bc5301418ed6432c047668a4547ab531a7439b816fac3
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: "http://searxng:8080/"
      SEARXNG_REDIS_URL: "redis://searxng-valkey:6379/0"
      SEARXNG_SECRET: "${SEARXNG_SECRET:?set SEARXNG_SECRET in .env - run ./init.sh}"
    volumes:
      # Enables the JSON API. Without it every query returns 403.
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    depends_on:
      - searxng-valkey
    networks: [stack]

  searxng-valkey:
    image: docker.io/valkey/valkey:8-alpine@sha256:e0eb7c480958d32bdc4357a74bdd70653ae15f2f9b4c93c4a5a9fad1dc471c84
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    networks: [stack]

  # ---------------------------------------------------------------- scraper --
  # Self-hosted Firecrawl: no credit metering, no external account.
  # Disable the whole scraper with:  docker compose --profile no-scraper up -d
  firecrawl-api:
    image: ghcr.io/firecrawl/firecrawl:2.10.1@sha256:a7a8c9b2f81276c83a90d6d8877b2ecc953805c8feabe2cd5783be28e750cc88
    restart: unless-stopped
    command: ["node", "dist/src/harness.js", "--start-docker"]
    environment:
      HOST: "0.0.0.0"
      PORT: "3002"
      INTERNAL_PORT: "3002"
      WORKER_PORT: "3005"
      EXTRACT_WORKER_PORT: "3004"
      ENV: "local"
      USE_DB_AUTHENTICATION: "false"
      REDIS_URL: "redis://firecrawl-redis:6379"
      REDIS_RATE_LIMIT_URL: "redis://firecrawl-redis:6379"
      PLAYWRIGHT_MICROSERVICE_URL: "http://firecrawl-playwright:3000/scrape"
      NUQ_RABBITMQ_URL: "amqp://firecrawl-rabbitmq:5672"
      POSTGRES_HOST: "firecrawl-nuq-postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "postgres"
      POSTGRES_PASSWORD: "${FIRECRAWL_POSTGRES_PASSWORD:?set in .env - run ./init.sh}"
      SEARXNG_ENDPOINT: "http://searxng:8080"
      NUM_WORKERS_PER_QUEUE: "4"
      MAX_CONCURRENT_JOBS: "3"
    depends_on:
      firecrawl-rabbitmq:
        condition: service_healthy
      firecrawl-redis:
        condition: service_started
      firecrawl-playwright:
        condition: service_started
      firecrawl-nuq-postgres:
        condition: service_started
    networks: [stack]

  firecrawl-playwright:
    image: ghcr.io/firecrawl/playwright-service:latest@sha256:468009bae00911d40d7120d58489a1d529362c22c45585cb9076094fe61b0025
    restart: unless-stopped
    environment:
      PORT: "3000"
      MAX_CONCURRENT_PAGES: "5"
      BLOCK_MEDIA: "true"
      ALLOW_LOCAL_WEBHOOKS: "false"
    networks: [stack]

  firecrawl-redis:
    image: docker.io/valkey/valkey:8-alpine@sha256:e0eb7c480958d32bdc4357a74bdd70653ae15f2f9b4c93c4a5a9fad1dc471c84
    restart: unless-stopped
    command: ["valkey-server", "--bind", "0.0.0.0", "--save", "", "--appendonly", "no"]
    networks: [stack]

  firecrawl-rabbitmq:
    image: docker.io/library/rabbitmq:4-alpine@sha256:4b93812804b41679198d340bfb644ff93f270a1658b28cb57dab6c85516a5da1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [stack]

  firecrawl-nuq-postgres:
    # Purpose-built image with the NuQ queue extensions. Stock postgres fails.
    image: ghcr.io/firecrawl/nuq-postgres:latest@sha256:aed86f62858f29bd971abddcdeb301c12888098d2cf5d33c1ba42b053bc460f6
    restart: unless-stopped
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "postgres"
      POSTGRES_PASSWORD: "${FIRECRAWL_POSTGRES_PASSWORD:?set in .env - run ./init.sh}"
    volumes:
      - firecrawl-pgdata:/var/lib/postgresql/data
    networks: [stack]

  # ----------------------------------------------------------------- agent --
  hermes-agent:
    image: docker.io/nousresearch/hermes-agent:v2026.8.27@sha256:e0df6adebddf29b91112aefc999d4aaf6846c9eb544faca5672a16a13590ff79
    restart: unless-stopped
    environment:
      HERMES_HOME: /opt/data
      HERMES_UID: "${HERMES_UID:-1000}"
      HERMES_GID: "${HERMES_GID:-1000}"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: "${HERMES_API_SERVER_KEY:?set in .env - run ./init.sh}"
      SEARXNG_URL: "http://searxng:8080"
      FIRECRAWL_API_URL: "${FIRECRAWL_API_URL:-http://firecrawl-api:3002}"
      HERMES_GATEWAY_API_KEY: "${HERMES_GATEWAY_API_KEY:-}"
      HERMES_MODEL_PROVIDER: "${HERMES_MODEL_PROVIDER:-custom}"
      HERMES_MODEL_DEFAULT: "${HERMES_MODEL_DEFAULT:?set your model in .env}"
      HERMES_MODEL_BASE_URL: "${HERMES_MODEL_BASE_URL:?set your gateway URL in .env}"
      HERMES_EXTRACT_BACKEND: "${HERMES_EXTRACT_BACKEND:-firecrawl}"
    volumes:
      - hermes-home:/opt/data
      - ./bootstrap.py:/bootstrap/bootstrap.py:ro
      - ./hermes-config.partial.yaml:/bootstrap/config.yaml.partial:ro
    # Compose has no init containers, so config rendering is chained ahead of
    # the gateway. `entrypoint-dispatch.sh` is the image's own dispatcher and
    # must stay in the chain — it sets up the s6 supervision tree.
    entrypoint:
      - /bin/bash
      - -c
      - "python3 /bootstrap/bootstrap.py && exec /opt/hermes/docker/entrypoint-dispatch.sh gateway run"
    networks: [stack]
    depends_on:
      - searxng

  # ------------------------------------------------------------- admin UI --
  hermes-webui:
    image: ghcr.io/nesquena/hermes-webui:0.38.5@sha256:bfd85f546c3aa282c65107ce15d348a9d87f2c8b6594d46ae60e0d06dd1964c9
    restart: unless-stopped
    depends_on:
      - hermes-agent
    ports:
      # Localhost only. This UI can run commands as the agent — put a reverse
      # proxy with TLS + auth in front before exposing it anywhere else.
      - "127.0.0.1:8787:8787"
    environment:
      HERMES_HOME: /opt/data
      HERMES_WEBUI_HOST: "0.0.0.0"
      HERMES_WEBUI_PORT: "8787"
      HERMES_WEBUI_STATE_DIR: /opt/data/webui
      HERMES_WEBUI_PASSWORD: "${HERMES_WEBUI_PASSWORD:?set in .env - run ./init.sh}"
      HERMES_API_URL: "http://hermes-agent:8642"
      WANTED_UID: "${HERMES_UID:-1000}"
      WANTED_GID: "${HERMES_GID:-1000}"
    volumes:
      - hermes-home:/opt/data
    networks: [stack]

  # -------------------------------------------------------------- chat UI --
  open-webui:
    image: ghcr.io/open-webui/open-webui:main@sha256:c792953395b43d4f49085fa4026850c5e923578345ebeaf56eabd980bcfc273a
    restart: unless-stopped
    depends_on:
      - hermes-agent
    ports:
      - "${OPEN_WEBUI_BIND:-127.0.0.1}:3000:8080"
    environment:
      # /v1 suffix is mandatory for model discovery.
      OPENAI_API_BASE_URL: "http://hermes-agent:8642/v1"
      OPENAI_API_KEY: "${HERMES_API_SERVER_KEY:?set in .env - run ./init.sh}"
      ENABLE_OLLAMA_API: "false"
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: "searxng"
      SEARXNG_QUERY_URL: "http://searxng:8080/search?q=<query>&format=json"
      WEB_LOADER_ENGINE: "${WEB_LOADER_ENGINE:-firecrawl}"
      FIRECRAWL_API_BASE_URL: "${FIRECRAWL_API_URL:-http://firecrawl-api:3002}"
      FIRECRAWL_API_KEY: "self-hosted-no-auth"
      WEBUI_SECRET_KEY: "${OPEN_WEBUI_SECRET_KEY:?set in .env - run ./init.sh}"
      WEBUI_URL: "${OPEN_WEBUI_PUBLIC_URL:-http://localhost:3000}"
      ANONYMIZED_TELEMETRY: "false"
      DO_NOT_TRACK: "true"
      SCARF_NO_ANALYTICS: "true"
    volumes:
      - open-webui-data:/app/backend/data
    networks: [stack]

networks:
  stack:
    driver: bridge

volumes:
  hermes-home:
  open-webui-data:
  firecrawl-pgdata:
