# Kata Containers runtime overlay.
#
# Applies the cluster's `kata` RuntimeClass to workloads that execute untrusted
# input. Unlike the gVisor overlay, this intentionally carries no runsc-specific
# Firecrawl compatibility preload.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: hermes-agent
    patch: |-
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: kata
  - target:
      kind: Deployment
      name: firecrawl-playwright
    patch: |-
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: kata
  - target:
      kind: Deployment
      name: firecrawl-api
    patch: |-
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: kata
