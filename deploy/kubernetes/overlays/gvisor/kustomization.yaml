# gVisor runtime overlay.
#
# Applies the cluster's `gvisor` RuntimeClass to workloads that execute
# untrusted input. Firecrawl's API also receives the runsc-specific
# systeminformation compatibility preload. Kata deployments must use the
# sibling `../kata` overlay so this gVisor-only shim is not loaded.
#
# IMPORTANT: applying a RuntimeClass that does not exist on the cluster leaves
# pods Pending with a FailedCreatePodSandBox / RuntimeClass-not-found event.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

configMapGenerator:
  - name: firecrawl-systeminformation-compat
    files:
      - firecrawl-systeminformation-compat.cjs

patches:
  - target:
      kind: Deployment
      name: hermes-agent
    patch: |-
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
  - target:
      kind: Deployment
      name: firecrawl-playwright
    patch: |-
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
  - target:
      kind: Deployment
      name: firecrawl-api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: firecrawl-api
      spec:
        template:
          spec:
            runtimeClassName: gvisor
            containers:
              - name: api
                env:
                  # Preload the compatibility shim into the harness and every
                  # inherited queue-worker process.
                  - name: NODE_OPTIONS
                    value: --require=/opt/firecrawl-compat/firecrawl-systeminformation-compat.cjs
                  # The preload lives outside /app, so make the image's own
                  # dependencies resolvable from the mounted module.
                  - name: NODE_PATH
                    value: /app/node_modules
                volumeMounts:
                  - name: systeminformation-compat
                    mountPath: /opt/firecrawl-compat/firecrawl-systeminformation-compat.cjs
                    subPath: firecrawl-systeminformation-compat.cjs
                    readOnly: true
            volumes:
              - name: systeminformation-compat
                configMap:
                  name: firecrawl-systeminformation-compat
