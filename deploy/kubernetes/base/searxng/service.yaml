apiVersion: v1
kind: Service
metadata:
  name: searxng
  labels:
    app.kubernetes.io/name: searxng
    app.kubernetes.io/part-of: hermes-search-stack
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: searxng
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: searxng-valkey
  labels:
    app.kubernetes.io/name: searxng-valkey
    app.kubernetes.io/part-of: hermes-search-stack
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: searxng-valkey
  ports:
    - name: redis
      port: 6379
      targetPort: redis
