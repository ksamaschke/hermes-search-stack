apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: hermes-search-stack
spec:
  replicas: 1
  strategy:
    # The PVC is RWO; a rolling update would deadlock on volume attach.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-agent
        app.kubernetes.io/component: agent
        app.kubernetes.io/part-of: hermes-search-stack
    spec:
      # Keep the agent off the same node as the Firecrawl API. Both are heavy
      # at startup (the agent discovers 55 plugins; Firecrawl boots the API
      # plus ten node workers) and co-scheduling them on a busy node starves
      # both: the agent's gateway never reaches its listener and Firecrawl
      # times out waiting for port 3002.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values: ["firecrawl-api", "firecrawl-playwright"]
      # SANDBOXED RUNTIME
      # The agent executes model-authored shell commands, so it is the one
      # workload in this stack that genuinely wants kernel-level isolation.
      # `runtimeClassName` is intentionally ABSENT from the base so the stack
      # installs on vanilla clusters. The `sandboxed` overlay patches in
      # gVisor (runsc) or Kata. See docs/sandboxing.md.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: render-config
          image: docker.io/nousresearch/hermes-agent:v2026.8.27@sha256:e0df6adebddf29b91112aefc999d4aaf6846c9eb544faca5672a16a13590ff79
          imagePullPolicy: IfNotPresent
          command: ["python3", "/bootstrap/bootstrap.py"]
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: HERMES_MODEL_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: hermes-agent-runtime
                  key: model-provider
            - name: HERMES_MODEL_DEFAULT
              valueFrom:
                configMapKeyRef:
                  name: hermes-agent-runtime
                  key: model-default
            - name: HERMES_MODEL_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: hermes-agent-runtime
                  key: model-base-url
            - name: HERMES_EXTRACT_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: hermes-agent-runtime
                  key: extract-backend
            # bootstrap.py writes the profile .env, which is where the gateway
            # resolves the API server from - so the init container needs the
            # same key the main container gets.
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-secrets
                  key: api-server-key
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: API_SERVER_PORT
              value: "8642"
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: bootstrap
              mountPath: /bootstrap
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: hermes-agent
          image: docker.io/nousresearch/hermes-agent:v2026.8.27@sha256:e0df6adebddf29b91112aefc999d4aaf6846c9eb544faca5672a16a13590ff79
          imagePullPolicy: IfNotPresent
          # NO args/command here on purpose. This image self-supervises: s6
          # runs the gateway as the `gateway-default` service. Passing
          # ["gateway","run"] as CMD starts a SECOND gateway through
          # main-wrapper.sh, and because the supervised one runs with
          # `--replace` the two evict each other in a loop - the process is
          # always "up" but the 8642 listener never survives, and the state
          # file records migrated_from: legacy-container-cmd.
          ports:
            - name: api
              containerPort: 8642
          env:
            - name: HERMES_HOME
              value: /opt/data
            # --- Kill runtime pip installs ----------------------------------
            #
            # The image already sets HERMES_DISABLE_LAZY_INSTALLS=1, but that
            # seal is conditional: lazy_deps._allow_lazy_installs() returns
            # `_lazy_install_target() is not None`, so installs are ALLOWED
            # again whenever a durable target is configured - and the image
            # points that at /opt/data, which is our writable PVC.
            #
            # The result was a gateway that hung at boot on
            # "Lazy-installing edge-tts==7.2.7", pinned at 100% CPU holding
            # zero sockets, never reaching the 8642 bind while s6 happily
            # reported the service as up.
            #
            # An empty value resolves to None (_lazy_install_target() strips
            # and treats "" as unset), which re-arms the image's seal. This is
            # deliberately enforced via env as well as via
            # security.allow_lazy_installs in config.yaml: config lives on the
            # PVC and can be shadowed by stale state, env cannot.
            - name: HERMES_LAZY_INSTALL_TARGET
              value: ""
            - name: HERMES_UID
              value: "10000"
            - name: HERMES_GID
              value: "10000"
            # --- OpenAI-compatible API server (consumed by Open WebUI) -------
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: API_SERVER_PORT
              value: "8642"
            # Gateway refuses to bind the listener unless this is >= 16 chars.
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-secrets
                  key: api-server-key
            # --- Search + scrape --------------------------------------------
            - name: SEARXNG_URL
              valueFrom:
                configMapKeyRef:
                  name: hermes-agent-runtime
                  key: searxng-url
            - name: FIRECRAWL_API_URL
              valueFrom:
                configMapKeyRef:
                  name: hermes-agent-runtime
                  key: firecrawl-url
                  optional: true
            # --- Model gateway credential -----------------------------------
            # Named by model.key_env in config.yaml. The VALUE lives in a
            # Secret that is never part of this repository.
            - name: HERMES_GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-secrets
                  key: model-api-key
          volumeMounts:
            - name: data
              mountPath: /opt/data
            # s6-overlay refuses to start unless /run is writable and owned by
            # the container uid: "/run belongs to uid 0 ... and we're lacking
            # the privileges to fix it". The image's /run is root-owned, so
            # give it an emptyDir that fsGroup makes group-writable.
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
          # Boot is genuinely slow: s6 runs cont-init, syncs 82 bundled
          # skills onto the PVC and resolves a Chromium binary before the
          # gateway binds 8642. Without a startupProbe the liveness probe
          # kills the container mid-boot (exit 137) and it never converges.
          startupProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            # 60 * 15s = up to 15 minutes for a first boot on a cold PVC.
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: api
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              # Boot is CPU-bound, not I/O-bound: the gateway discovers 55
              # plugins and runs a ~50-item tool-capability sweep before it
              # binds 8642. At 250m the process sat in state=R with zero
              # sockets open, taking minutes per pass and never reaching the
              # listener; with cores actually available the identical config
              # binds in ~10-20s.
              #
              # Sizing is constrained: the gvisor RuntimeClass carries
              # scheduling.nodeSelector gvisor-enabled=true, and exactly ONE
              # node (k3s-worker-05) has that label. Every sandboxed workload
              # in the cluster therefore lands on that single 4-CPU node, so
              # this request must fit beside firecrawl-api and playwright.
              # 1 CPU is the largest value that schedules there today; raising
              # it further needs another gvisor-enabled node, not a bigger
              # number here.
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # s6-overlay supervises services and calls s6-applyuidgid to
              # drop to the hermes user. With ALL capabilities dropped that
              # fails with "unable to set supplementary group list:
              # Operation not permitted" and the gateway never binds 8642.
              add: ["SETUID", "SETGID"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-agent-data
        # bootstrap.py and config.yaml.partial live in two separate
        # ConfigMaps but the script reads both from /bootstrap, so they must
        # be projected into a single directory. Mounting only one ConfigMap
        # here makes the init container die on FileNotFoundError.
        - name: bootstrap
          projected:
            defaultMode: 0555
            sources:
              - configMap:
                  name: hermes-agent-bootstrap
              - configMap:
                  name: hermes-agent-config
        # s6-overlay writes its supervision tree into /run at startup.
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
