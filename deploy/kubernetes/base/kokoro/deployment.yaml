apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kokoro-cache
  labels:
    app.kubernetes.io/name: kokoro-web
    app.kubernetes.io/part-of: hermes-search-stack
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kokoro-web
  labels:
    app.kubernetes.io/name: kokoro-web
    app.kubernetes.io/component: text-to-speech
    app.kubernetes.io/part-of: hermes-search-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kokoro-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kokoro-web
        app.kubernetes.io/component: text-to-speech
        app.kubernetes.io/part-of: hermes-search-stack
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kokoro-web
          image: ghcr.io/eduardolat/kokoro-web:v0.1.3@sha256:58202493d16e2b116a9593fc02adf8ceaca6e8a95ad72369733059707a7d3d17
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: KW_SECRET_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kokoro-secrets
                  key: api-key
            - name: KW_PUBLIC_NO_TRACK
              value: "true"
          volumeMounts:
            - name: cache
              mountPath: /kokoro/cache
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: kokoro-cache
---
apiVersion: v1
kind: Service
metadata:
  name: kokoro-web
  labels:
    app.kubernetes.io/name: kokoro-web
    app.kubernetes.io/part-of: hermes-search-stack
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kokoro-web
  ports:
    - name: http
      port: 3000
      targetPort: http
