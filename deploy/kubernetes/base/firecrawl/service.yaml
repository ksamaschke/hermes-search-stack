apiVersion: v1
kind: Service
metadata:
  name: firecrawl-api
  labels:
    app.kubernetes.io/name: firecrawl-api
    app.kubernetes.io/part-of: hermes-search-stack
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: firecrawl-api
  ports:
    - name: http
      port: 3002
      targetPort: http
---
